[Config]
; EnableLogging: 0 = Disabled, 1 = Enabled (creates battle_overlay_log.txt in plugins folder)
EnableLogging=0

; Opacity: HUD drawing opacity (0 = completely invisible, 255 = fully opaque)
; Default 102 represents ~40% opacity.
Opacity=102

; HideAllyStats: 0 = Show ally stats, 1 = Hide ally stats
HideAllyStats=0

