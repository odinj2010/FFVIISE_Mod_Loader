[Config]
; ==============================================================================
; General HUD Settings
; ==============================================================================

; EnableLogging: Enable logging output (true/false). Creates battle_overlay_log.txt in the plugins folder.
EnableLogging=false

; Opacity: HUD panel background opacity (0 = completely invisible, 255 = fully opaque)
; Default 102 represents ~40% opacity.
Opacity=102

; ShowParty: Show or hide ally stats and progress bars (true/false)
ShowParty=true

; ShowEnemies: Show or hide enemy stats and progress bars (true/false)
ShowEnemies=true

; ShowATB: Show or hide ATB progress bars (true/false)
ShowATB=true

; ShowNumericHP: Display exact numeric HP values (e.g. 9999/9999) next to the progress bars (true/false)
ShowNumericHP=false


; ==============================================================================
; Layout & Positioning
; ==============================================================================

; PanelX/PanelY: Position of the HUD panel (coordinates in pixels)
PanelX=10
PanelY=10

; PanelWidth/PanelHeight: Dimensions of the HUD panel in pixels
PanelWidth=510
PanelHeight=410


; ==============================================================================
; Fonts & Sizing
; ==============================================================================

; FontFace: Font to use for overlay rendering (must be installed on the system, e.g. Consolas, Arial, Segoe UI)
FontFace=Consolas

; TitleFontSize: Size of the main title font
TitleFontSize=20

; TextFontSize: Size of the body text font
TextFontSize=16


; ==============================================================================
; Custom Colors
; ==============================================================================
; You can specify colors using:
; - HEX format (e.g. #RRGGBB or 0xRRGGBB)
; - Decimal RGB format (e.g. R, G, B)

; PlayerHPColor: Color of the player character HP progress bars
PlayerHPColor=0, 200, 80

; EnemyHPColor: Color of the enemy HP progress bars
EnemyHPColor=220, 40, 40

; ATBColor: Color of the ATB progress bars
ATBColor=255, 140, 0

; PanelBgColor: Background color of the overlay panel
PanelBgColor=15, 15, 20

; PanelBorderColor: Color of the border surrounding the panel
PanelBorderColor=0, 122, 204

; TitleColor: Color of the title text "FFVII BATTLE ANALYZER"
TitleColor=0, 192, 255

; TextColorAlly: Color of ally status text lines
TextColorAlly=230, 230, 230

; TextColorEnemy: Color of enemy status text lines
TextColorEnemy=255, 80, 80

; TextColorHeader: Color of section headers ("--- ALLIES ---", "--- ENEMIES ---")
TextColorHeader=255, 255, 255
