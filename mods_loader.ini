[Loader]
; ==============================================================================
; General Loader Settings
; ==============================================================================

; EnableMods: Enable or disable mod loading (true/false)
; If set to false, the game will load in its completely vanilla state.
EnableMods=true

; ModsDirectory: The directory name where mods are located (relative to the game folder)
; Each mod should live in its own subfolder inside this folder (e.g. mods/ModName/)
; Control loading priority by creating 'mods/load_order.txt' listing mod folder names
; (one per line, highest priority at the top). Auto-loads alphabetically if missing.
ModsDirectory=mods

; EnablePlugins: Enable or disable loaded dll plugins in the plugins directory (true/false)
EnablePlugins=true

; PluginsDirectory: The directory name where DLL plugins are located (relative to the game folder)
PluginsDirectory=plugins

; SplashScreens: How to handle splash screens (dotemu-logo.png, finelogo.png, press_start.png)
; - custom: Always loads the custom PNGs embedded in the DLL (ignores the mods folder). (default)
; - default: Checks active mod folders first for replacements (e.g. mods/ModName/dotemu-logo.png). If not found, loads original game files.
SplashScreens=custom

; OverlayDisplayTime: How long the loader's greeting banner remains visible on launch (in milliseconds)
; Set to 5000 for 5 seconds, or 0 to disable the launch banner completely.
OverlayDisplayTime=5000


; ==============================================================================
; Logging & Debugging Settings
; ==============================================================================

; ShowConsole: Show a command prompt console window side-by-side with the game (true/false)
; Useful for developers to see mod loader and plugin logs in real time.
ShowConsole=true

; EnableLogging: Enable logging output to the log file (true/false)
EnableLogging=true

; LogFile: The name of the log file to generate (placed in the game directory)
LogFile=mods_loader_log.txt

; VerboseLogging: Enable detailed path tracing and redirection logs (true/false)
; Useful for debugging complex directory overrides, but generates a lot of text.
VerboseLogging=true

; EnableTextureLogging: Enable texture creation logging to the texture log file (true/false)
EnableTextureLogging=true

; TextureLogFile: The name of the texture log file to generate
TextureLogFile=d3d11_texture_log.txt

; DisableD3D11Hooks: Bypass Direct3D 11 graphics API interception (true/false)
; When set to true, disables all graphics hooking, including high-resolution texture
; overrides (battle stages, background sheets), custom canvas rendering, and the developer overlay.
; This is useful for troubleshooting crashes, measuring vanilla graphics performance,
; or identifying compatibility conflicts with external game overlays (like Discord or Steam).
; Default is false (enables graphics modding features).
DisableD3D11Hooks=false
